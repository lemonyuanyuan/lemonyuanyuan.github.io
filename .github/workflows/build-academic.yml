name: Build Academic Homepage

on:
  push:
    branches: [main, master]
    paths:
      - 'academic-source/**'
      - '.github/workflows/build-academic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: academic-source

      - name: Build Jekyll site
        run: |
          cd academic-source
          bundle install
          bundle exec jekyll build --baseurl "/portfolio" --destination ../portfolio
          touch ../portfolio/.nojekyll

      - name: Commit and push portfolio output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild academic homepage at /portfolio"
            git push
          fi
